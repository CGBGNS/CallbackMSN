<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Genesys Web Messaging Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2em;
      background-color: #f9f9f9;
    }

    #openChatButton {
      position: fixed;
      bottom: 30px;
      left: 30px;
      z-index: 999999;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background-color: #0066cc;
      color: white;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    #openChatButton:hover {
      background-color: #004f9e;
    }
  </style>
</head>

<body>
  <h1>Genesys Web Messaging Test</h1>

  <p>This is a test page for Genesys Web Messaging.</p>

  <button id="openChatButton">
    Open a chat with attributes
  </button>

  <script type="text/javascript" charset="utf-8">
    (function (g, e, n, es, ys) {
      g['_genesysJs'] = e;
      g[e] = g[e] || function () {
        (g[e].q = g[e].q || []).push(arguments);
      };
      g[e].t = 1 * new Date();
      g[e].c = es;
      ys = document.createElement('script');
      ys.async = 1;
      ys.src = n;
      ys.charset = 'utf-8';
      document.head.appendChild(ys);
    })(window, 'Genesys', 'https://apps.mypurecloud.de/genesys-bootstrap/genesys.min.js', {
      environment: 'prod-euc1',
      deploymentId: '9fbc8fc9-80a5-4d6d-b832-dc7b8779a873'
    });

    function setCustomAttributes() {
      return new Promise(function (resolve, reject) {
        Genesys(
          "command",
          "Database.set",
          {
            messaging: {
              customAttributes: {
                customerName: "John Doe",
                customerEmail: "john.doe@example.com",
                customerId: "123456",
                source: "Private Web Portal",
                authenticatedUser: "true"
              }
            }
          },
          function () {
            console.log("Custom attributes set successfully");
            resolve();
          },
          function (error) {
            console.error("Error setting custom attributes", error);
            reject(error);
          }
        );
      });
    }

    function openMessenger() {
      Genesys(
        "command",
        "Messenger.open",
        {},
        function () {
          console.log("Messenger opened successfully");
        },
        function (error) {
          console.error("Error opening Messenger", error);
        }
      );
    }

    document.getElementById("openChatButton").addEventListener("click", async function () {
      console.log("Open chat button clicked");

      try {
        await setCustomAttributes();
        openMessenger();
      } catch (error) {
        console.error("Could not open chat because custom attributes failed", error);
      }
    });
  </script>
</body>
</html>
