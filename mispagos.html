<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis pagos</title>

  <style>
    :root {
      --ink: #1d2733;
      --muted: #5b6878;
      --line: #d5dce4;
      --paper: #ffffff;
      --ground: #eef2f6;
      --accent: #0a5cb8;
      --ok: #1f7a4d;
      --ok-bg: #e7f4ec;
      --warn: #a15c00;
      --warn-bg: #fdf2e1;
      --err: #b3261e;
      --err-bg: #fbeceb;
      --radius-s: 4px;
      --radius-m: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      color: var(--ink);
      background: var(--ground);
    }

    header {
      padding: 20px 32px;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }
    header a { color: var(--accent); text-decoration: none; font-size: 14px; }
    header a:hover { text-decoration: underline; }
    header h1 { margin: 6px 0 0; font-size: 26px; font-weight: 600; }

    main {
      max-width: 1080px;
      padding: 24px 32px 120px;
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; padding: 16px 16px 120px; }
      header { padding: 16px; }
    }

    section.panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius-m);
      padding: 20px;
    }
    section.panel h2 { margin: 0 0 12px; font-size: 18px; font-weight: 600; }
    .wide { grid-column: 1 / -1; }

    /* Próximo pago: lo primero que el cliente quiere saber */
    .next {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 32px;
      align-items: flex-end;
      justify-content: space-between;
    }
    .next .amount { font-size: 40px; font-weight: 600; line-height: 1; }
    .next .when { color: var(--muted); margin-top: 6px; }
    .next .when b { color: var(--ink); font-weight: 600; }

    button, .btn {
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      border-radius: var(--radius-s);
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 8px 14px;
      text-decoration: none;
      display: inline-block;
    }
    button:hover, .btn:hover { background: #f3f6f9; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button.primary:hover { background: #084a94; }
    :focus-visible { outline: 3px solid #7fb2ee; outline-offset: 1px; }

    .notice {
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: var(--radius-s);
      background: var(--ok-bg);
      color: var(--ok);
      font-size: 14px;
    }

    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .filters button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 520px; }
    th {
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
    }
    td { padding: 10px; border-bottom: 1px solid #e7ebf0; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr:last-child td { border-bottom: none; }

    .tag {
      display: inline-block;
      font-size: 13px;
      padding: 2px 10px;
      border-radius: 999px;
    }
    .tag.paid { background: var(--ok-bg); color: var(--ok); }
    .tag.pending { background: var(--warn-bg); color: var(--warn); }
    .tag.failed { background: var(--err-bg); color: var(--err); }

    .empty { color: var(--muted); padding: 16px 10px; }

    dl { margin: 0; }
    dl div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #e7ebf0; }
    dl div:last-child { border-bottom: none; }
    dt { color: var(--muted); }
    dd { margin: 0; font-weight: 600; text-align: right; }

    .method { display: flex; gap: 12px; align-items: center; }
    .card-chip {
      width: 46px; height: 30px;
      border-radius: var(--radius-s);
      background: #1d3b66;
      color: #fff;
      font-size: 11px;
      display: grid; place-items: center;
      flex: none;
    }
    .method p { margin: 0; }
    .method .sub { color: var(--muted); font-size: 14px; }

    #openChatButton {
      position: fixed;
      bottom: 30px;
      left: 30px;
      z-index: 999999;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background-color: #0066cc;
      color: white;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }
    #openChatButton:hover { background-color: #004f9e; }
  </style>
</head>

<body>
  <header>
    <a href="index.html">Volver al inicio</a>
    <h1>Mis pagos</h1>
  </header>

  <main>
    <section class="panel wide" aria-labelledby="nextTitle">
      <h2 id="nextTitle">Próximo pago</h2>
      <div class="next">
        <div>
          <div class="amount" id="nextAmount"></div>
          <div class="when">Vence el <b id="nextDate"></b> · Cuota mensual del servicio</div>
        </div>
        <button type="button" class="primary" id="payNow">Pagar ahora</button>
      </div>
      <div class="notice" id="payNotice" role="status" hidden></div>
    </section>

    <section class="panel" aria-labelledby="historyTitle">
      <h2 id="historyTitle">Historial de pagos</h2>
      <div class="filters" role="group" aria-label="Filtrar por estado">
        <button type="button" data-filter="all" aria-pressed="true">Todos</button>
        <button type="button" data-filter="paid" aria-pressed="false">Pagados</button>
        <button type="button" data-filter="pending" aria-pressed="false">Pendientes</button>
        <button type="button" data-filter="failed" aria-pressed="false">Rechazados</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Concepto</th>
              <th>Estado</th>
              <th class="num">Importe</th>
            </tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </section>

    <div style="display:grid; gap:24px">
      <section class="panel" aria-labelledby="summaryTitle">
        <h2 id="summaryTitle">Resumen del año</h2>
        <dl>
          <div><dt>Total pagado</dt><dd id="sumPaid"></dd></div>
          <div><dt>Pendiente</dt><dd id="sumPending"></dd></div>
          <div><dt>Pagos realizados</dt><dd id="countPaid"></dd></div>
        </dl>
      </section>

      <section class="panel" aria-labelledby="methodTitle">
        <h2 id="methodTitle">Método de pago</h2>
        <div class="method">
          <div class="card-chip" aria-hidden="true">VISA</div>
          <div>
            <p>Tarjeta terminada en 4821</p>
            <p class="sub">Caduca 08/2028 · Cargo automático activado</p>
          </div>
        </div>
        <p style="margin:14px 0 0">
          <button type="button" id="changeMethod">Cambiar método de pago</button>
        </p>
      </section>
    </div>
  </main>

  <button id="openChatButton">¿Dudas con un pago? Escríbenos</button>

  <!-- Mismo despliegue que index.html: la conversación abierta continúa aquí -->
  <script type="text/javascript" charset="utf-8">
    (function (g, e, n, es, ys) {
      g['_genesysJs'] = e;
      g[e] = g[e] || function () {
        (g[e].q = g[e].q || []).push(arguments);
      };
      g[e].t = 1 * new Date();
      g[e].c = es;
      ys = document.createElement('script');
      ys.async = 1;
      ys.src = n;
      ys.charset = 'utf-8';
      document.head.appendChild(ys);
    })(window, 'Genesys', 'https://apps.mypurecloud.de/genesys-bootstrap/genesys.min.js', {
      environment: 'prod-euc1',
      deploymentId: 'd8e8dbf0-3461-4fc1-bebe-5b95400811f8'
    });
  </script>

  <script>
  (function () {
    "use strict";
    const $ = (id) => document.getElementById(id);

    /* Datos de ejemplo. Sustitúyelos por la llamada a tu API de pagos. */
    const NEXT_PAYMENT = { amount: 49.90, date: "2026-12-05" };
    const PAYMENTS = [
      { date: "2026-11-05", concept: "Cuota mensual noviembre", status: "paid",    amount: 49.90 },
      { date: "2026-10-18", concept: "Cambio de equipo",        status: "pending", amount: 25.00 },
      { date: "2026-10-05", concept: "Cuota mensual octubre",   status: "paid",    amount: 49.90 },
      { date: "2026-09-05", concept: "Cuota mensual septiembre",status: "failed",  amount: 49.90 },
      { date: "2026-09-08", concept: "Cuota mensual septiembre (reintento)", status: "paid", amount: 49.90 },
      { date: "2026-08-05", concept: "Cuota mensual agosto",    status: "paid",    amount: 49.90 },
      { date: "2026-07-05", concept: "Cuota mensual julio",     status: "paid",    amount: 49.90 }
    ];

    const STATUS_LABEL = { paid: "Pagado", pending: "Pendiente", failed: "Rechazado" };

    const money = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" });
    const longDate = new Intl.DateTimeFormat("es-ES", { day: "numeric", month: "long", year: "numeric" });
    const shortDate = new Intl.DateTimeFormat("es-ES", { day: "2-digit", month: "2-digit", year: "numeric" });
    const parse = (iso) => new Date(iso + "T12:00:00");

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    /* Próximo pago */
    $("nextAmount").textContent = money.format(NEXT_PAYMENT.amount);
    $("nextDate").textContent = longDate.format(parse(NEXT_PAYMENT.date));

    $("payNow").addEventListener("click", () => {
      const n = $("payNotice");
      n.hidden = false;
      n.textContent = "Pago de " + money.format(NEXT_PAYMENT.amount) +
        " registrado. Recibirás el justificante por correo electrónico.";
      $("payNow").disabled = true;
    });

    $("changeMethod").addEventListener("click", () => {
      alert("Aquí se abriría el formulario de cambio de método de pago.");
    });

    /* Historial */
    function renderHistory(filter) {
      const rows = PAYMENTS
        .filter((p) => filter === "all" || p.status === filter)
        .sort((a, b) => b.date.localeCompare(a.date));

      $("historyBody").innerHTML = rows.length
        ? rows.map((p) =>
            "<tr>" +
              "<td>" + shortDate.format(parse(p.date)) + "</td>" +
              "<td>" + escapeHtml(p.concept) + "</td>" +
              '<td><span class="tag ' + p.status + '">' + STATUS_LABEL[p.status] + "</span></td>" +
              '<td class="num">' + money.format(p.amount) + "</td>" +
            "</tr>").join("")
        : '<tr><td colspan="4" class="empty">No hay pagos con este estado.</td></tr>';
    }

    document.querySelectorAll(".filters button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filters button").forEach((b) => b.setAttribute("aria-pressed", "false"));
        btn.setAttribute("aria-pressed", "true");
        renderHistory(btn.dataset.filter);
      });
    });

    renderHistory("all");

    /* Resumen */
    const paid = PAYMENTS.filter((p) => p.status === "paid");
    const pending = PAYMENTS.filter((p) => p.status === "pending");
    $("sumPaid").textContent = money.format(paid.reduce((t, p) => t + p.amount, 0));
    $("sumPending").textContent = money.format(pending.reduce((t, p) => t + p.amount, 0));
    $("countPaid").textContent = paid.length;

    /* Chat: si ya hay conversación abierta, Genesys la retoma solo.
       El botón la abre si el cliente llega aquí directamente. */
    $("openChatButton").addEventListener("click", () => {
      Genesys("command", "Database.set",
        { messaging: { customAttributes: { source: "Mis pagos" } } },
        () => Genesys("command", "Messenger.open", {}, () => {}, () => {}),
        (err) => console.error("Error al enviar los atributos", err)
      );
    });
  })();
  </script>
</body>
</html>
